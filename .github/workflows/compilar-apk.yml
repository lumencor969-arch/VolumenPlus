name: Compilar APK

on:
  push:
    paths:
      - 'VolumenPlus.zip'
      - '.github/workflows/compilar-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar
        run: |
          unzip -q VolumenPlus.zip
          cd VolumenPlus
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../VolumenPlus.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VolumenPlus
          path: VolumenPlus.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Volumen+ ${{ github.run_number }}
          files: VolumenPlus.apk
